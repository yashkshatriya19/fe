<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Search</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

        <h1>Movie Search</h1>

        <form id="search-form">

            <input
                type="text"
                id="search-input"
                placeholder="Search movies..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Search
            </button>

        </form>


        <p id="loading">
            Loading movies...
        </p>

        <p id="error-message"></p>


        <section>

            <div class="section-heading">

                <h2 id="section-title">
                    Random Movies
                </h2>

                <span id="result-count"></span>

            </div>


            <div id="movies"></div>


            <p id="no-results">
                No movies found.
            </p>

        </section>

    </main>


    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>

</html>
