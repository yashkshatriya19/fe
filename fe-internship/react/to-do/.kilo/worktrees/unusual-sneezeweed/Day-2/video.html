<!DOCTYPE html>
<html>
<head>
    <title>Video Example</title>
</head>

<body>

    <h1>My Video</h1>

    <video
        controls
        width="600"
        poster="thumbnail.jpg"
        preload="metadata"
    >
        <source src="video.webm" type="video/webm">
        <source src="vid.mp4" type="video/mp4" preload="auto">

        <track
            kind="captions"
            src="captions.vtt"
            default
        >

        <p>
            Your browser doesn't support HTML video.
            <a href="video.mp4">Download the video</a>
        </p>
    </video>

</body>
</html>
