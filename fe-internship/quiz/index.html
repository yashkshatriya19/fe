<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini Quiz</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="quiz-container">

    <!-- =========================
         SETUP SCREEN
    ========================== -->

    <section id="setup-screen" class="card">

      <h1>Mini Quiz</h1>

      <p class="subtitle">
        Test your knowledge
      </p>


      <form id="setup-form">

        <!-- Name -->

        <div class="form-group">

          <label for="name">
            Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
          >

        </div>


        <!-- Age -->

        <div class="form-group">

          <label for="age">
            Age
          </label>

          <input
            type="number"
            id="age"
            name="age"
            placeholder="Enter your age"
            min="5"
            max="100"
            required
          >

        </div>


        <!-- Topic -->

        <fieldset>

          <legend>Choose Topic</legend>

          <label class="topic-option">

            <input
              type="radio"
              name="topic"
              value="javascript"
              required
            >

            <span>JavaScript</span>

          </label>


          <label class="topic-option">

            <input
              type="radio"
              name="topic"
              value="html"
            >

            <span>HTML</span>

          </label>


          <label class="topic-option">

            <input
              type="radio"
              name="topic"
              value="css"
            >

            <span>CSS</span>

          </label>

        </fieldset>


        <button type="submit">
          Start Quiz →
        </button>

      </form>

    </section>


    <!-- =========================
         QUIZ SCREEN
    ========================== -->

    <section id="quiz-screen" class="card">

      <div class="quiz-header">

        <p id="question-number">
          Question 1 / 5
        </p>

        <p id="user-name"></p>

      </div>


      <h2 id="question">
        Question goes here
      </h2>


      <div id="options">
        <!-- Options created by JS -->
      </div>


      <button
        id="next-btn"
        type="button"
      >
        Next →
      </button>

    </section>


    <!-- =========================
         RESULT SCREEN
    ========================== -->

    <section id="result-screen" class="card">

      <p class="result-label">
        QUIZ COMPLETE
      </p>

      <h1 id="result-title">
        Well Done!
      </h1>

      <p id="result-message"></p>

      <div class="score-box">

        <span>Your Score</span>

        <strong id="final-score">
          0 / 0
        </strong>

      </div>


      <div id="review">
        <!-- Results created by JS -->
      </div>


      <button
        id="restart-btn"
        type="button"
      >
        Try Again ↻
      </button>

    </section>

  </main>


  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>

</html>
