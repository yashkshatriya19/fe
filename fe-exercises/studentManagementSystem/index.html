<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <h1>Student Management System</h1>

    <!-- Student Data Display Section -->
    <div>
        <p>Total Students: <span id="totalStudents">0</span></p>
        <p>Average Marks: <span id="averageMarks">0</span></p>
        <p>Highest Grade: <span id="highestMarks">0</span></p>
        <p>Lowest Grade: <span id="lowestMarks">0</span></p>
        <p>Passed Students: <span id="passedStudents">0</span></p>
        <p>Failed Students: <span id="failedStudents">0</span></p>
    </div>

    <!-- Add Student Form -->
    <form class="student-form" id="student-form">
        <h2>Add New Student</h2>

         <!-- Student Name Input -->
        <label for="name">Enter Student Name:</label>
        <input type="text" id="name" name="name">
        <p id="nameError" class="error"></p>
        <br><br>

        <!-- Student Email Input -->
        <label for="email">Enter Student Email:</label>
        <input type="email" id="email" name="email">
        <p id="emailError" class="error"></p>
        <br><br>

        <!-- Student Age Input -->
        <label for="age">Enter Student Age:</label>
        <input type="number" id="age" name="age">
        <p id="ageError" class="error"></p>
        <br><br>

        <!-- Student Gender Input -->
        <label for="gender">Select Student Gender:</label>
        <input type="radio" name="gender" id="male" value="Male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="Female">
        <label for="female">Female</label>
        <p id="genderError" class="error"></p>
        <br><br>

        <!-- Student Course Selection -->
        <label for="course">Select Student Course:</label>
        <select id="course" name="course">
            <option value="" selected disabled>Select a course</option>
            <option value="React">React</option>
            <option value="Node.js">Node.js</option>
            <option value="JavaScript">JavaScript</option>
            <option value="TypeScript">TypeScript</option>
        </select>
        <p id="courseError" class="error"></p>
        <br><br>

        <!-- // Student Marks Input -->
        <label for="marks">Enter Student Marks:</label>
        <input type="number" id="marks" name="marks">
        <p id="marksError" class="error"></p>
        <br><br>

        <!-- // Student City Input -->
        <label for="city">Enter Student City:</label>
        <input type="text" id="city" name="city">
        <p id="cityError" class="error"></p>
        <br><br>
        
        <input type="submit" value="Add Student">
    </form>
    <div id="studentList">
        <h2>Student List</h2>
        <input type="search" name="search" id="search" placeholder="Search students...">
        <select id="courseFilter">
            <option value="">All Courses</option>
            <option value="React">React</option>
            <option value="Node.js">Node.js</option>
            <option value="JavaScript">JavaScript</option>
            <option value="TypeScript">TypeScript</option>
        </select>

        <select id="genderFilter">
            <option value="">All Genders</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <select id="gradeFilter">
            <option value="">All Grades</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="F">F</option>
        </select>

        <label for="sortFilter">Sort By:</label>

        <select id="sortFilter">
            <option value="">Default</option>
            <option value="name">Name</option>
            <option value="age">Age</option>
            <option value="marks">Marks</option>
            <option value="grade">Grade</option>
        </select>
        
        <table id="studentsTable">
        
            <thead>
                
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>Grade</th>
                    <th>City</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsBody">
                <!-- Student rows will be added here dynamically -->
            </tbody>
        </table>
        <div class="pagination" id="pagination">

    <button id="prevPage">
        Previous
    </button>

    <div id="pageNumbers"></div>

    <button id="nextPage">
        Next
    </button>
    <button id="clearAll">Clear All</button>
</div>
    </div>
</body>
<script type="module" src="./js/app.js"></script>
</html>
