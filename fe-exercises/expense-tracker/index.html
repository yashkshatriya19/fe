<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>expense-tracker</title>
  </head>
  <body>
    <div class="transaction-form">
        <h1>Add Transaction</h1>
        <form>
            <label for="title">Title</label>
            <input type="text" id="title" name="title"  />
            <p id="titleError" class="error"></p>
            <br><br>
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount"  />
            <p id="amountError" class="error"></p>
            <br>
            <label for="category">Category</label>
            <select id="category" name="category" >
              <option value="" disabled default selected>Select a category</option>
              <option value="food">Food</option>
              <option value="travel">Travel</option>
              <option value="shopping">Shopping</option>
              <option value="bills">Bills</option>
              <option value="salary">Salary</option>
            </select>
            <p id="categoryError" class="error"></p>
            <br><br>
            <label for="date">Date</label>
            <input type="date" id="date" name="date"  />
            <p id="dateError" class="error"></p>
            <br><br>
            <label for="payment">Payment</label>
            <select id="payment" name="payment" >
              <option value="" disabled default selected>Select a payment method</option>
              <option value="cash">Cash</option>
              <option value="card">Card</option>
              <option value="upi">Upi</option>
            </select>
            <p id="paymentError" class="error"></p>
            <br><br>
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes"></textarea>
            <p id="notesError" class="error"></p>
            <br><br>
            <button type="submit">Add Transaction</button>
        </form>
    </div>
    <div class="transaction-list">
        <h1>Transactions</h1>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Payment</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
