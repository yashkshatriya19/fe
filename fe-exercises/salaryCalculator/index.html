<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Employee Salary Calculator</h1>
    <form class="form" id="form">

        <label for="name">Enter Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <p id="nameError" class="error"></p>
        <br><br>

        <label for="ID">Enter ID:</label>
        <input type="text" id="ID" name="ID" placeholder="Enter your ID">
        <p id="idError" class="error"></p>
        <br><br>

        <label for="department">Select Department:</label>
        <select id="department" name="department">
            <option value="">Select a department</option>
            <option value="IT">IT</option>
            <option value="Marketing">Marketing</option>
            <option value="Finance">Finance</option>
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
        </select>
        <p id="departmentError" class="error"></p>
        <br><br>

        <label for="designation">Enter Designation:</label>
        <input type="text" id="designation" name="designation" placeholder="Enter your designation">
        <p id="designationError" class="error"></p>
        <br><br>

        <label for="salary">Enter Basic Salary:</label>
        <input type="number" id="salary" name="salary" placeholder="Enter your salary">
        <p id="salaryError" class="error"></p>
        <br><br>

        <label for="experience">Enter Experience:</label>
        <input type="number" id="experience" name="experience" placeholder="Enter your experience" step="0.1" min="0">
        <p id="experienceError" class="error"></p>
        <br><br>

        <label for="rating">Perfomance Rating:</label>
        <input type="number" id="rating" name="rating" placeholder="Enter your rating" step="0.1" min="0">
        <p id="ratingError" class="error"></p>
        <br><br>

        <input type="submit" value="Add Employee">
    </form>
    <div id="employeeList">
        <h2>Employee List</h2>
        <input type="search" name="search" id="search" placeholder="Search employees...">
        <select id="departmentFilter">
            <option value="">All Departments</option>
            <option value="IT">IT</option>
            <option value="Marketing">Marketing</option>
            <option value="Finance">Finance</option>
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
        </select>
        <select id="ratingFilter">
            <option value="">All Ratings</option>
            <option value="5.0">5.0</option>
            <option value="4.5">4.5</option>
            <option value="4.0">4.0</option>
            <option value="3.5">3.5</option>
            <option value="3.0">3.0</option>
        </select>
        <select id="sortFilter">
            <option value="">Default</option>
            <option value="salary">Salary</option>
            <option value="experience">Experience</option>
        </select>
        <table id="employeesTable">
        
            <thead>
                
                <tr>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Salary</th>
                    <th>Experience</th>
                    <th>Rating</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="employeesBody">
                <!-- Employee rows will be added here dynamically -->
            </tbody>
        </table>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
